# Local-first dev: Postgres + (later) Caddy for TLS on the VPS.
# `docker compose up -d` brings up Postgres; the Go API and Next.js app run
# on the host during dev (see Makefile / README).
services:
  postgres:
    image: postgres:16-alpine
    container_name: tbl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbl
      POSTGRES_PASSWORD: tbl_dev
      POSTGRES_DB: thebiglearn
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a host Postgres
    volumes:
      - tbl_pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbl -d thebiglearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tbl_pgdata:
